<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Research Radar: All fetched articles</title>
    <link rel="stylesheet" href="chrome://__addonRef__/content/allItems.css" />
  </head>
  <body>
    <!-- No <select> menus: they do not render in Zotero's separate windows -->
    <header class="toolbar">
      <div id="tiers" class="seg" role="group" aria-label="Tier"></div>
      <input
        id="search"
        type="search"
        placeholder="Search titles, authors, DOIs…"
      />
      <div id="sort" class="seg" role="group" aria-label="Sort"></div>
    </header>
    <div class="layout">
      <nav id="journals" class="sidebar" aria-label="Journals"></nav>
      <section class="content">
        <p id="count" class="muted"></p>
        <div id="rows"></div>
      </section>
    </div>
  </body>
</html>
