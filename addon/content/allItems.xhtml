<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Research Radar: All fetched articles</title>
    <link rel="stylesheet" href="chrome://__addonRef__/content/allItems.css" />
  </head>
  <body>
    <header class="toolbar">
      <select id="tier" aria-label="Tier"></select>
      <select id="journal" aria-label="Journal"></select>
      <input
        id="search"
        type="search"
        placeholder="Search titles, authors, DOIs…"
      />
      <select id="sort" aria-label="Sort">
        <option value="newest">Newest first</option>
        <option value="points">Most points first</option>
      </select>
    </header>
    <p id="count" class="muted"></p>
    <main id="rows"></main>
  </body>
</html>
